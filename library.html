<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OIXS27 | مكتبة الاختصارات</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#000;
color:white;
font-family:Arial,sans-serif;
}

header{
padding:25px 15px;
text-align:center;
}

h1{
color:#ffd54f;
font-size:30px;
}

header p{
color:#bdbdbd;
}

main{
max-width:750px;
margin:auto;
padding:15px;
}

.box{
background:#1c1c1e;
padding:18px;
margin-bottom:18px;
border-radius:22px;
}

input,select{
width:100%;
padding:14px;
margin:7px 0;
background:#2c2c2e;
color:white;
border:1px solid #48484a;
border-radius:12px;
font-size:16px;
}

button{
border:0;
padding:13px;
border-radius:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.add{
background:#30d158;
color:#000;
width:100%;
margin-top:10px;
}

.copy{
background:#ffd54f;
color:#000;
width:100%;
margin-top:10px;
}

#list{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.card{
position:relative;
min-height:155px;
border-radius:25px;
padding:17px;
display:flex;
flex-direction:column;
justify-content:space-between;
overflow:hidden;
box-shadow:inset 0 0 30px #ffffff15;
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
}

.icon{
font-size:32px;
}

.open{
display:flex;
align-items:center;
justify-content:center;
width:40px;
height:40px;
border-radius:50%;
background:#ffffff30;
color:white;
text-decoration:none;
font-size:20px;
}

.card h3{
font-size:19px;
line-height:1.4;
margin:18px 0 8px;
overflow-wrap:anywhere;
}

.delete{
background:#00000025;
color:white;
font-size:12px;
padding:6px 10px;
align-self:flex-start;
}

.note{
color:#aaa;
font-size:13px;
line-height:1.8;
text-align:center;
}

#status{
color:#30d158;
text-align:center;
}

.back{
display:block;
background:#2c2c2e;
color:white;
padding:17px;
margin:25px 0;
border-radius:18px;
text-align:center;
text-decoration:none;
font-weight:bold;
}

summary{
font-size:20px;
font-weight:bold;
cursor:pointer;
padding:8px;
}

footer{
text-align:center;
color:#888;
padding:25px;
}
</style>
</head>

<body>

<header>
<h1>🇸🇦 OIXS27</h1>
<p>مكتبة اختصارات الآيفون</p>
</header>

<main>

<details class="box">
<summary>➕ إضافة اختصار جديد</summary>

<input id="name" placeholder="اسم الاختصار">

<input id="link"
placeholder="رابط الاختصار من iCloud">

<label>🎨 اختر اللون</label>

<select id="color">
<option value="#3478f6">🔵 أزرق</option>
<option value="#168b42">🟢 أخضر</option>
<option value="#e94b55">🔴 أحمر</option>
<option value="#9254cc">🟣 بنفسجي</option>
<option value="#b87900">🟡 ذهبي</option>
<option value="#d66b19">🟠 برتقالي</option>
<option value="#d63384">🌸 وردي</option>
<option value="#636366">⚫ رمادي</option>
</select>

<label>⭐ اختر الأيقونة</label>

<select id="icon">
<option>📱</option>
<option>⚙️</option>
<option>📁</option>
<option>💳</option>
<option>🛒</option>
<option>🔐</option>
<option>📷</option>
<option>🕌</option>
<option>⏰</option>
<option>🌐</option>
<option>⭐</option>
<option>🍎</option>
<option>💧</option>
<option>🔋</option>
<option>🇸🇦</option>
</select>

<button class="add" onclick="addShortcut()">
➕ إضافة الاختصار
</button>

<p id="status" role="status"></p>

</details>

<input id="search"
placeholder="🔍 ابحث عن اختصار"
oninput="render()">

<div id="list"></div>

<section class="box" style="margin-top:25px">

<button class="copy" onclick="exportData()">
📋 نسخ بيانات الاختصارات
</button>

<p class="note">
الإضافات تحفظ على هذا المتصفح فقط.
لإظهارها للجميع، انسخ البيانات واحفظها
في ملف shortcuts.json على GitHub.
</p>

</section>

<a class="back" href="folders.html">
📁 الرجوع إلى المجلدات
</a>

</main>

<footer>
© 2026 OIXS27 🇸🇦
</footer>

<script>

const KEY="oixs27_library_v1";

let shortcuts=[];

const colors=[
"#3478f6",
"#168b42",
"#e94b55",
"#9254cc",
"#b87900",
"#d66b19",
"#d63384",
"#636366"
];

const icons=[
"🍎","⚙️","💧","📁",
"🔋","🔐","📱"
];

const initial=[
{
name:"اشتراكات Apple",
link:"https://www.icloud.com/shortcuts/2b387c04359044f681f819615cfdd385"
},
{
name:"إدارة أدوات",
link:"https://www.icloud.com/shortcuts/071ebf1c50d943daac0832060de6f378"
},
{
name:"إخراج الماء",
link:"https://www.icloud.com/shortcuts/59b9fec8a53f4bf2bd09549bc0359881"
},
{
name:"مساحة تخزين iPhone",
link:"https://www.icloud.com/shortcuts/c99dbcbca3c74e38bcaaeaf27629380f"
},
{
name:"إيقاف وتشغيل",
link:"https://www.icloud.com/shortcuts/6aea6f24281441dbbe95725a59c90e24"
},
{
name:"التعبئة التلقائية وكلمات السر",
link:"https://www.icloud.com/shortcuts/8f7fa789752648a089cdc1fde4323880"
},
{
name:"جهة اتصال استرداد Apple",
link:"https://www.icloud.com/shortcuts/873e78832cbd449fa43ea2c3e500a66c"
}
];

function valid(link){
return /^https:\/\/[^\s]+$/i.test(link);
}

function save(){
try{
localStorage.setItem(
KEY,JSON.stringify(shortcuts)
);
return true;
}catch(e){
return false;
}
}

function addShortcut(){

const name=document.getElementById("name").value.trim();
const link=document.getElementById("link").value.trim();
const color=document.getElementById("color").value;
const icon=document.getElementById("icon").value;
const status=document.getElementById("status");

if(!name||!valid(link)){
status.textContent="⚠️ اكتب الاسم ورابط iCloud الصحيح";
return;
}

if(shortcuts.some(x=>
x.link.replace(/\/$/,"")===link.replace(/\/$/,"")
)){
status.textContent="⚠️ الاختصار موجود مسبقاً";
return;
}

shortcuts.push({
name,link,color,icon
});

if(!save()){
shortcuts.pop();
status.textContent="⚠️ تعذر حفظ الاختصار";
return;
}

document.getElementById("name").value="";
document.getElementById("link").value="";

status.textContent="✅ تمت إضافة الاختصار";

render();
}

function removeShortcut(index){

if(!confirm("هل تريد حذف الاختصار؟")){
return;
}

const removed=shortcuts.splice(index,1)[0];

if(!save()){
shortcuts.splice(index,0,removed);
alert("تعذر حفظ التغيير");
}

render();
}

function render(){

const list=document.getElementById("list");
const search=document.getElementById("search").value.trim().toLowerCase();

list.replaceChildren();

shortcuts.forEach((item,index)=>{

if(!item.name.toLowerCase().includes(search)){
return;
}

const card=document.createElement("div");

card.className="card";

card.style.background=
colors.includes(item.color)
?item.color
:colors[index%colors.length];

const top=document.createElement("div");
top.className="top";

const icon=document.createElement("span");
icon.className="icon";
icon.textContent=item.icon||icons[index%icons.length];

const open=document.createElement("a");
open.className="open";
open.textContent="▶";
open.href=item.link;
open.target="_blank";
open.rel="noopener noreferrer";
open.setAttribute("aria-label","فتح "+item.name);

top.append(icon,open);

const title=document.createElement("h3");
title.textContent=item.name;

const del=document.createElement("button");
del.className="delete";
del.textContent="🗑 حذف";
del.onclick=()=>removeShortcut(index);

card.append(top,title,del);

list.append(card);

});

}

async function exportData(){

const data=JSON.stringify(shortcuts,null,2);

try{

await navigator.clipboard.writeText(data);

alert("✅ تم نسخ بيانات الاختصارات");

}catch(e){

const area=document.createElement("textarea");
area.value=data;
document.body.append(area);
area.select();
area.setSelectionRange(0,area.value.length);

let copied=false;

try{
copied=document.execCommand("copy");
}catch(e){}

if(copied){
area.remove();
alert("✅ تم نسخ البيانات");
}else{
alert("انسخ البيانات المحددة يدوياً");
}

}

}

async function start(){

let stored=null;

try{
stored=JSON.parse(localStorage.getItem(KEY));
}catch(e){}

if(Array.isArray(stored)){

shortcuts=stored.filter(x=>
x&&typeof x.name==="string"&&valid(x.link)
);

}else{

try{

const response=await fetch(
"shortcuts.json",{cache:"no-store"}
);

if(!response.ok)throw Error();

const data=await response.json();

shortcuts=Array.isArray(data)
?data.filter(x=>x&&typeof x.name==="string"&&valid(x.link))
:initial;

}catch(e){

shortcuts=initial;

}

save();

}

render();

}

start();

</script>

</body>
</html>
