<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خلفيات OIXS27</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
padding:15px;
background:#082e20;
color:#ffd700;
font-family:Arial,sans-serif;
}

main{
max-width:650px;
margin:auto;
}

h1,h2,p{
text-align:center;
}

.card{
background:#123e30;
border:1px solid #526d49;
padding:18px;
border-radius:20px;
margin:20px 0;
}

img{
display:block;
width:100%;
height:auto;
border-radius:15px;
margin:15px auto;
}

a{
display:block;
background:#185c39;
color:#ffd700;
text-align:center;
padding:17px;
border-radius:12px;
text-decoration:none;
margin:12px 0;
}

footer{
text-align:center;
padding:25px;
}
</style>
</head>

<body>

<main>

<h1 id="heading">OIXS27</h1>
<h2>🎨 مكتبة الخلفيات</h2>

<p id="status">جاري تحميل الخلفيات...</p>

<div id="list"></div>

<a href="index.html">
↩️ العودة للرئيسية
</a>

</main>

<footer>OIXS27 © 2026</footer>

<script>

function safeURL(value){
if(!value)return "";
try{
const u = new URL(value,location.href);
return u.protocol === "https:" ? u.href : "";
}catch{
return "";
}
}

async function loadWallpapers(){

const status = document.getElementById("status");
const list = document.getElementById("list");

try{

const response = await fetch(
"content/shortcuts.json?v="+Date.now(),
{cache:"no-store"}
);

if(!response.ok){
throw new Error("تعذر تحميل البيانات");
}

const data = await response.json();

const settings = data.settings || {};

document.getElementById("heading").textContent =
settings.title || "OIXS27";

if(/^#[0-9a-f]{6}$/i.test(settings.background || "")){
document.body.style.background = settings.background;
}

if(/^#[0-9a-f]{6}$/i.test(settings.color || "")){
document.body.style.color = settings.color;
}

const items = data.wallpapers || [];

list.replaceChildren();

if(!items.length){
status.textContent = "لا توجد خلفيات حالياً";
return;
}

status.textContent = "";

items.forEach(item=>{

const card = document.createElement("div");
card.className = "card";

const title = document.createElement("h2");
title.textContent = item.title || item.name || "خلفية";
card.appendChild(title);

const image = safeURL(item.image) || safeURL(item.link);

if(image){

const img = document.createElement("img");
img.src = image;
img.alt = title.textContent;

img.onerror = ()=>{
img.replaceWith(
document.createTextNode("الصورة غير متاحة حالياً")
);
};

card.appendChild(img);

}

const description = document.createElement("p");
description.textContent = item.description || "";
card.appendChild(description);

const link = safeURL(item.link) || image;

if(link){

const button = document.createElement("a");
button.href = link;
button.download = "";
button.textContent = "📥 تحميل الخلفية";
card.appendChild(button);

}

list.appendChild(card);

});

}catch(error){

status.textContent = "❌ "+error.message;

}

}

loadWallpapers();

</script>

</body>
</html>
