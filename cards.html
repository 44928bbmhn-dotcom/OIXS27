<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OIXS27 | بطاقات الشحن</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: #0b1626;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
  text-align: center;
}

header {
  background: #15243b;
  padding: 30px 15px;
}

h1 {
  color: #ffd54f;
}

.card {
  background: #15243b;
  margin: 20px auto;
  padding: 25px;
  border-radius: 20px;
  width: 90%;
  max-width: 450px;
}

select, button, .back {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
}

select {
  background: #253750;
  color: white;
}

button {
  background: #246da8;
  color: white;
  cursor: pointer;
}

.icon {
  font-size: 55px;
}

.back {
  display: block;
  background: #455468;
  color: white;
  text-decoration: none;
}

.notice {
  color: #ffd54f;
  padding: 15px;
}

</style>
</head>

<body>

<header>
<h1>OIXS27</h1>
<h2>💳 بطاقات الشحن الرقمية</h2>
</header>

<p class="notice">
نسخة تجريبية - لا يوجد دفع حقيقي
</p>

<div class="card">
<div class="icon">🍎</div>
<h2>Apple Gift Card</h2>

<select id="apple">
<option value="50">50 ريال</option>
<option value="100">100 ريال</option>
<option value="200">200 ريال</option>
</select>

<button onclick="choose('Apple','apple')">
اختيار البطاقة
</button>
</div>

<div class="card">
<div class="icon">▶️</div>
<h2>Google Play</h2>

<select id="google">
<option value="50">50 ريال</option>
<option value="100">100 ريال</option>
</select>

<button onclick="choose('Google Play','google')">
اختيار البطاقة
</button>
</div>

<div class="card">
<p id="result">اختر بطاقة للتجربة</p>

<a class="back" href="index.html">
🏠 العودة للرئيسية
</a>
</div>

<script>
function choose(name,id) {
  const price = document.getElementById(id).value;
  document.getElementById('result').textContent =
  'اختيار تجريبي: ' + name + ' - ' + price + ' ريال';
}
</script>

<footer>
<p>OIXS27 © 2026</p>
</footer>

</body>
</html>
